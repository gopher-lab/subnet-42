name: Build Docker Images (PR)

on:
  pull_request:
    branches:
      - main

concurrency:
  group: docker-build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image: subnet-42
          - dockerfile: Dockerfile.vpn
            image: vpn-service
          - dockerfile: Dockerfile.cookies.generator
            image: cookies-generator
          - dockerfile: Dockerfile.cookies.updater.docker
            image: cookies-updater-docker
          - dockerfile: Dockerfile.cookies.updater.kubernetes
            image: cookies-updater-kubernetes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
