name: Build Extra Docker Images (main/tags)

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: docker-build-extra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile.vpn
            image: vpn-service
          - dockerfile: Dockerfile.cookies.generator
            image: cookies-generator
          - dockerfile: Dockerfile.cookies.updater.docker
            image: cookies-updater-docker
          - dockerfile: Dockerfile.cookies.updater.kubernetes
            image: cookies-updater-kubernetes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
